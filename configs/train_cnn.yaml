name: cnn_baseline
seed: 42
manifest: data/manifest_processed.csv
sample_rate: 16000
window_s: 3.0              # every clip is cropped/padded to this length

features:                  # log-mel computed on the fly inside the model
  n_fft: 1024
  hop: 256
  n_mels: 64
  fmin: 50
  fmax: 8000
  spec_augment: true       # train-time frequency/time masking

model:
  channels: [24, 48, 96, 192]   # small on purpose: trains on CPU
  dropout: 0.3

train:
  epochs: 25
  batch_size: 32
  lr: 0.002
  weight_decay: 0.0001
  label_smoothing: 0.05
  patience: 6              # early stopping on validation UAR
  num_workers: 0           # keep 0 on Windows
  noise_prob: 0.5          # chance of adding Gaussian noise
  snr_db: [15, 40]
  # Extra per-dataset loss multiplier, e.g. {tess: 0.5} to down-weight the very clean TESS.
  dataset_weights: {}

out_dir: runs
